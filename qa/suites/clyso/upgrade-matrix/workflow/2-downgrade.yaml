tasks:
- cephadm.shell:
    env: [base_image, target_image_name, base_image_name]
    host.a:
      - echo "=== PRE-DOWNGRADE STATE ==="
      - ceph version
      - ceph orch ps
      - ceph -s

      - echo "Starting downgrade from $target_image_name to $base_image_name"
      - ceph orch upgrade start --image $base_image
      - while ceph orch upgrade status | jq '.in_progress' | grep true && ! ceph orch upgrade status | jq '.message' | grep Error ; do ceph orch ps ; ceph versions ; ceph orch upgrade status ; sleep 30 ; done

      - echo "=== POST-DOWNGRADE VERIFICATION ==="
      - ceph orch ps
      - ceph versions
      - ceph versions | jq -e '.overall | length == 1'
      - ceph -s
      - echo "Downgrade complete"
