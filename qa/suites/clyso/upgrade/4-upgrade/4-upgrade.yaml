tasks:
- cephadm.shell:
    env: [target_image, target_image_name, base_image_name]
    host.a:
      - echo "=== PRE-UPGRADE STATE ==="
      - ceph version
      - ceph orch ps
      - ceph -s

      - echo "Starting upgrade from $base_image_name to $target_image_name"
      - ceph orch upgrade start --image $target_image
      - while ceph orch upgrade status | jq '.in_progress' | grep true && ! ceph orch upgrade status | jq '.message' | grep Error ; do ceph orch ps ; ceph versions ; ceph orch upgrade status ; sleep 30 ; done

      - echo "=== POST-UPGRADE VERIFICATION ==="
      - ceph orch ps
      - ceph versions
      - ceph versions | jq -e '.overall | length == 1'
      - ceph -s
      - echo "Upgrade complete"

overrides:
  ceph:
    log-ignorelist:
      - CEPHADM_STRAY_DAEMON
      - CEPHADM_FAILED_DAEMON
      - CEPHADM_AGENT_DOWN
      - CEPHADM_DAEMON_PLACE_FAIL
    log-only-match:
      - CEPHADM_
